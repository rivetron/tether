services:
  # ! Redis for caching and session storage
  redis:
    image: redis:7.2-alpine
    container_name: tether-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-tether123}"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5

  # * MongoDB for persistent storage
  mongodb:
    image: mongo:7.0
    container_name: tether-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-tether}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-tether123}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-tether}
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 3s
      retries: 5

  # ? Tether Application
  tether:
    build: .
    container_name: tether-app
    ports:
      - "5000:5000"
    environment:
      - ENVIRONMENT=docker
      - MONGO_URI=mongodb://tether:tether123@mongodb:27017/tether?authSource=admin
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=tether123
      - SERVER_PORT=5000
      - BASE_URL=http://localhost:5000
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5000/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
    driver: local
  mongodb_data:
    driver: local

networks:
  default:
    name: tether-network
